version: '3.9'

services:
  db:
    image: postgres:15
    container_name: my_project_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./db/sample_data.sql:/docker-entrypoint-initdb.d/sample_data.sql

  app:
    build: ./app
    container_name: my_project_app
    env_file: ../.env
    depends_on:
      - db
    ports:
      - "8000:8000"   # if your app has a web server

volumes:
  db_data:
  